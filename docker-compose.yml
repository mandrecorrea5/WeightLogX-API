version: '3.8'

# Docker Compose para a stack principal: API + DB + Monitoramento (Sem PostHog)

services:
  # 1. Serviço do Banco de Dados PostgreSQL (Principal)
  db:
    image: postgres:14-alpine
    container_name: weightlogx_db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-user_weightlogx}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password_segura}
      POSTGRES_DB: ${DATABASE_NAME:-weightlogx_db}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - weightlogx_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-user_weightlogx} -d ${DATABASE_NAME:-weightlogx_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Serviço da API Node.js/NestJS
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: weightlogx_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-user_weightlogx}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password_segura}
      DATABASE_NAME: ${DATABASE_NAME:-weightlogx_db}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      # Application
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      UPLOAD_DEST: ./uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5242880}
      PROFILE_IMAGE_PATH: ${PROFILE_IMAGE_PATH:-./uploads/profiles}
      # Authentication & Verification
      AUTH_VERIFICATION_EXPIRATION_MINUTES: ${AUTH_VERIFICATION_EXPIRATION_MINUTES:-5}
      AUTH_VERIFICATION_RESEND_LIMIT_PER_HOUR: ${AUTH_VERIFICATION_RESEND_LIMIT_PER_HOUR:-3}
      AUTH_DEBUG_RETURN_VERIFICATION_CODE: ${AUTH_DEBUG_RETURN_VERIFICATION_CODE:-false}
      # Brevo (Email/SMS)
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT:-587}
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-WeightLogX}
      # Health Check
      HEALTH_CHECK_ENABLED: ${HEALTH_CHECK_ENABLED:-true}
      HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT:-5000}
      # Tracing
      ENABLE_TRACING: ${ENABLE_TRACING:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}
      SERVICE_NAME: ${SERVICE_NAME:-weightlogx-api}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.0.1}
      # Swagger
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      # Cron Jobs
      ENABLE_CRON_REMINDERS: ${ENABLE_CRON_REMINDERS:-true}
      ENABLE_CRON_INACTIVITY: ${ENABLE_CRON_INACTIVITY:-true}
      INACTIVITY_DAYS: ${INACTIVITY_DAYS:-7}
      INACTIVITY_CRON_SCHEDULE: ${INACTIVITY_CRON_SCHEDULE:-0 9 * * *}
      # Throttle
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-60}
    volumes:
      - ./uploads:/app/uploads
      - ./src/i18n:/app/src/i18n
    networks:
      - weightlogx_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # Prometheus - Coleta de métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: weightlogx_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - weightlogx_network
    depends_on:
      - api

  # Loki - Coleta de logs
  loki:
    image: grafana/loki:latest
    container_name: weightlogx_loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - weightlogx_network

  # Promtail - Envia logs para Loki
  promtail:
    image: grafana/promtail:latest
    container_name: weightlogx_promtail
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/app:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Volumes necessários para coletar logs do Docker (essencial)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - weightlogx_network
    depends_on:
      - loki

  # Grafana - Visualização de métricas e logs
  grafana:
    image: grafana/grafana:latest
    container_name: weightlogx_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    env_file:
      - .env.production
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - weightlogx_network
    depends_on:
      - prometheus
      - loki

  # Nginx - Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: weightlogx_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/certbot:/var/www/certbot:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
    networks:
      - weightlogx_network
    depends_on:
      - api
      - grafana
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  weightlogx_network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data: