version: '3.8'

# Docker Compose para produção
# Uso: docker-compose up --build
# 
# A aplicação será construída dentro do container usando o Dockerfile
# Ambos os serviços (api e db) estão na mesma rede Docker para comunicação
# O build da aplicação acontece no stage 'build' e é copiado para 'production'

services:
  # 1. Serviço do Banco de Dados PostgreSQL
  db:
    image: postgres:14-alpine
    container_name: weightlogx_db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-user_weightlogx}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password_segura}
      POSTGRES_DB: ${DATABASE_NAME:-weightlogx_db}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - weightlogx_network
    healthcheck:
      # Especifica o banco de dados para evitar erro "database user_weightlogx does not exist"
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-user_weightlogx} -d ${DATABASE_NAME:-weightlogx_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Serviço da API Node.js/NestJS
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production  # Usar stage de produção com build completo
    container_name: weightlogx_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database - usando o nome do serviço 'db' para comunicação na mesma rede Docker
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-user_weightlogx}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password_segura}
      DATABASE_NAME: ${DATABASE_NAME:-weightlogx_db}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      # Application
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Upload
      UPLOAD_DEST: ./uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5242880}
    volumes:
      # Volume para uploads persistente na raiz da aplicação
      - ./uploads:/app/uploads
      # Volume para i18n (caso precise de atualizações sem rebuild)
      - ./src/i18n:/app/src/i18n
    networks:
      - weightlogx_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  # Prometheus - Coleta de métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: weightlogx_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - weightlogx_network
    depends_on:
      - api

  # Loki - Coleta de logs
  loki:
    image: grafana/loki:latest
    container_name: weightlogx_loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - weightlogx_network

  # Promtail - Envia logs para Loki
  promtail:
    image: grafana/promtail:latest
    container_name: weightlogx_promtail
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/app:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - weightlogx_network
    depends_on:
      - loki

  # Grafana - Visualização de métricas e logs
  grafana:
    image: grafana/grafana:latest
    container_name: weightlogx_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - weightlogx_network
    depends_on:
      - prometheus
      - loki

networks:
  # Rede compartilhada entre api e db para comunicação interna
  # Os serviços podem se comunicar usando o nome do serviço (ex: db:5432)
  weightlogx_network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data: