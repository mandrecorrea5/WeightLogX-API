user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 1. BLOCO PARA TRATAR DOMÍNIOS NÃO MAPEADOS/RAIZ
    # Este bloco captura o tráfego HTTP para o domínio raiz (e www)
    # e retorna 404, garantindo que a API só seja acessada pelo subdomínio.
    server {
        listen 80;
        server_name weightlogx.com.br www.weightlogx.com.br;

        location / {
            return 404; # Retorna Not Found
        }
    }

    # 2. BLOCO PARA A API (Reverse Proxy)
    # Este bloco encaminha o tráfego de 'api.weightlogx.com.br' para o container 'api'.
    server {
        listen 80;
        server_name api.weightlogx.com.br;

        location / {
            # 'api' é o nome do serviço no docker-compose.yml
            # '3000' é a porta interna do NestJS
            proxy_pass http://api:3000;

            # Configurações para garantir que a API receba os cabeçalhos corretos
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
