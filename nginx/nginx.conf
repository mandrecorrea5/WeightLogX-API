# 1. BLOCO PARA TRATAR DOMÍNIOS NÃO MAPEADOS/RAIZ
# Este bloco captura o tráfego HTTP para o domínio raiz (e www)
# e retorna 404, garantindo que a API só seja acessada pelo subdomínio.
server {
    listen 80;
    server_name weightliftingx.com.br www.weightliftingx.com.br;

    location / {
        return 404; # Retorna Not Found
    }
}

# 2. BLOCO PARA A API (Reverse Proxy)
# Este bloco encaminha o tráfego de 'api.weightliftingx.com.br' para o container 'api'.
server {
    listen 80;
    server_name api.weightliftingx.com.br;

    location / {
        # 'api' é o nome do serviço no docker-compose.yml
        # '3000' é a porta interna do NestJS
        proxy_pass http://api:3000;

        # Configurações para garantir que a API receba o cabeçalho HTTPS correto
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}