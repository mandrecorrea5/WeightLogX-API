global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'weightlogx'
    environment: 'development'

# Alertmanager configuration (opcional, pode ser adicionado depois)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
rule_files:
  # - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # WeightLogX API metrics
  - job_name: 'weightlogx-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['api:3000']
        labels:
          service: 'weightlogx-api'
          environment: '${ENVIRONMENT:-development}'
    scrape_interval: 10s
    scrape_timeout: 5s

